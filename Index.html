<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Fish Tool</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.grid {
    display: grid;
    grid-template-columns: repeat(9, min(10vw, 50px));
    grid-template-rows: repeat(9, min(10vw, 50px));
}

.cell {
    border: 1px solid #bdbdbd;
    background: white;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.cell.selected {
    background: #3b82f6;
}

button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}
</style>
</head>
<body>

<div id="grid" class="grid"></div>

<button onclick="clearGrid()">Wissen</button>

<script>
const grid = document.getElementById("grid");

for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 9; col++) {

        const cell = document.createElement("div");
        cell.classList.add("cell");

        // Buitenrand
        if (row === 0) cell.style.borderTop = "3px solid black";
        if (row === 8) cell.style.borderBottom = "3px solid black";
        if (col === 0) cell.style.borderLeft = "3px solid black";
        if (col === 8) cell.style.borderRight = "3px solid black";

        // Verticale 3×3 scheidingen
        if (col === 2 || col === 5) {
            cell.style.borderRight = "3px solid black";
        }

        // Horizontale 3×3 scheidingen
        if (row === 2 || row === 5) {
            cell.style.borderBottom = "3px solid black";
        }

        cell.addEventListener("click", () => {
            cell.classList.toggle("selected");
        });

        grid.appendChild(cell);
    }
}

function clearGrid() {
    document.querySelectorAll(".cell").forEach(cell => {
        cell.classList.remove("selected");
    });
}
</script>

</body>
</html>
